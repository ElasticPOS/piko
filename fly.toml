# fly.toml app configuration file for Piko cluster
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Deploy with: fly deploy
# Scale to 3 nodes: fly scale count 3
# View status: fly status

app = 'piko-fragrant-voice-7319'
primary_region = 'fra'

[build]
  [build.args]
    GO_VERSION = '1.25.5'

[env]
  # Log level for Piko server
  LOG_LEVEL = 'info'

# Proxy port (8000) - main HTTP proxy for clients
[[services]]
  protocol = 'tcp'
  internal_port = 8000
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 10000
    soft_limit = 8000

  # Health check on admin port (8002) - not the proxy port
  [[services.tcp_checks]]
    grace_period = '30s'
    interval = '10s'
    timeout = '2s'
    port = 8002

# Upstream port (8001) - for upstream services to connect
[[services]]
  protocol = 'tcp'
  internal_port = 8001
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 8001
    handlers = ['tls']

  [services.concurrency]
    type = 'connections'
    hard_limit = 10000
    soft_limit = 8000

# Admin port (8002) - metrics, health checks, status API
# Exposed publicly for monitoring dashboards (Prometheus, Grafana)
[[services]]
  protocol = 'tcp'
  internal_port = 8002
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    port = 8002
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50

  # HTTP health check on admin port
  [[services.http_checks]]
    grace_period = '30s'
    interval = '10s'
    method = 'GET'
    path = '/health'
    protocol = 'http'
    timeout = '2s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# Note: Gossip port (8003) is only used internally between nodes
# via Fly.io's private networking (*.internal DNS). No public exposure needed.

# Deployment notes:
# 1. Deploy: fly deploy
# 2. Scale to 3 nodes: fly scale count 3
# 3. View logs: fly logs
# 4. Access admin panel: https://piko-fragrant-voice-7319.fly.dev:8002/
#    - /health - Health check
#    - /ready - Readiness check
#    - /metrics - Prometheus metrics
#    - /status/* - Status API
#    - /debug/pprof/* - Go profiling